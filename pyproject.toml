[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-cloner"
version = "0.1.0"
description = "GEMINI Cloner Tool — public Git, web, and tree cloning with optional Gemini analysis."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Dominic J. LaCavera Jr." }]
keywords = ["gemini", "cloner", "git", "archive", "oss"]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gemini-cloner = "gemini_cloner.cli:main"
gemini = "gemini_cloner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
